[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# 克制的工程风：深蓝主色、浅灰底、细边框；不加载外部字体（国内访问 Google Fonts 不稳）
[theme]
base = "light"
primaryColor = "#1E4B7A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1C2430"
linkColor = "#1E4B7A"
borderColor = "#E2E6EC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["1.75rem", "1.3rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
codeBackgroundColor = "#F4F6F9"
dataframeBorderColor = "#E2E6EC"
dataframeHeaderBackgroundColor = "#F4F6F9"
blueColor = "#1E4B7A"
greenColor = "#1E7F4F"
orangeColor = "#B86E00"
redColor = "#B3261E"
grayColor = "#6B7480"
chartCategoricalColors = ["#1E4B7A", "#3C8DBC", "#1E7F4F", "#B86E00", "#7A4FB3", "#B3261E", "#6B7480"]

[theme.sidebar]
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#E9EDF2"
borderColor = "#E2E6EC"
