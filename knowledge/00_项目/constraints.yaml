pass_rule:
  mechanical_ratio: 0.95
  mechanical_sd: 1
  haze_delta_max: 1.0
  transmittance_delta_min: -1.0
  note: 拉伸/撕裂/穿刺/热封 ≥ base×0.95 且 ≥ base−1SD；雾度 ≤ base+1.0；透光率 ≥ base−1%
